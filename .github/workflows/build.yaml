name: CI

on:
  push:
    tags:
      - '*'  
    # Publish these branches
    branches:
      - main
  # Run tests for any PRs.
  pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            checks: write # dorny/test-reporter publishes the TRX summary as a check run

        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: "10.0.x"
            - run: dotnet restore
            - run: dotnet build
            - name: dotnet format check
              run: dotnet format whitespace --verify-no-changes
            - name: test
              if:
                  (github.event_name == 'pull_request_target' && github.event.pull_request.user.login == 'dependabot[bot]') ||
                  (github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]') ||
                  github.event_name == 'push'
              env:
                  MANDRILL_API_KEY: ${{ secrets.MANDRILL_API_KEY }}
                  MANDRILL_SENDING_DOMAIN: ${{ secrets.MANDRILL_SENDING_DOMAIN }}
              # Microsoft.Testing.Platform (enabled via global.json); TRX report + coverlet.MTP lcov coverage.
              run: >-
                  dotnet test --project tests --configuration Release --output Detailed
                  --results-directory TestResults
                  --report-trx --report-trx-filename tests.trx
                  --coverlet --coverlet-output-format lcov
            - name: Rename coverage report
              if:
                  (github.event_name == 'pull_request_target' && github.event.pull_request.user.login == 'dependabot[bot]') ||
                  (github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]') ||
                  github.event_name == 'push'
              # coverlet.MTP writes coverage.<timestamp>.info; give it a stable name.
              run: mv TestResults/coverage.*.info TestResults/coverage.lcov
            - name: Test report
              if: always() && (
                      (github.event_name == 'pull_request_target' && github.event.pull_request.user.login == 'dependabot[bot]') ||
                      (github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]') ||
                      github.event_name == 'push')
              uses: dorny/test-reporter@v3
              with:
                  name: Test results
                  path: TestResults/*.trx
                  reporter: dotnet-trx
                  fail-on-error: false
            - name: Push coverage result
              if:
                  (github.event_name == 'pull_request_target' && github.event.pull_request.user.login == 'dependabot[bot]') ||
                  (github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]') ||
                  github.event_name == 'push'
              uses: coverallsapp/github-action@v2.3.8
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  path-to-lcov: ./TestResults/coverage.lcov

    publish-nuget:
        runs-on: ubuntu-latest
        # tag a release as v1.0.0....
        if: startsWith(github.ref, 'refs/tags/v')
        permissions:
            contents: read
            id-token: write # required for NuGet trusted publishing (OIDC)
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: "10.0.x"

            - name: pack
              run: dotnet pack --configuration Release -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg --output artifacts

            # Exchange the GitHub OIDC token for a short-lived nuget.org API key.
            # https://learn.microsoft.com/en-us/nuget/nuget-org/trusted-publishing
            - name: NuGet login
              uses: NuGet/login@v1
              id: nuget-login
              with:
                  user: ${{ secrets.NUGET_USER }} # nuget.org profile name, not email

            - name: push
              env:
                  NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
              run: dotnet nuget push artifacts/*.nupkg -k $NUGET_API_KEY -s https://api.nuget.org/v3/index.json --skip-duplicate
